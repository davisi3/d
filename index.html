<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Failu Krātuve</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        /* Augšupielādes sadaļa */
        .upload-section {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input[type="password"] {
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            width: 250px;
            font-size: 14px;
            outline: none;
        }

        .input-group input[type="password"]:focus {
            border-color: #3b82f6;
        }

        .file-label {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .file-label:hover {
            background: #2563eb;
        }

        #file-input {
            display: none;
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* Mapes/Failu skata sadaļa */
        .folder-view {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
        }

        .folder-header {
            font-weight: 600;
            margin-bottom: 15px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .file-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #334155;
        }

        .file-type {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📂 Failu Augšupielādes Sistēma</h1>

    <!-- Drošā augšupielāde -->
    <div class="upload-section">
        <div class="input-group">
            <input type="password" id="password-input" placeholder="Ievadiet paroli, lai augšupielādētu...">
        </div>
        <div>
            <label for="file-input" class="file-label">Izvēlēties & Augšupielādēt failu</label>
            <input type="file" id="file-input">
        </div>
        <p id="error-message" class="error-msg">Nepareiza parole! Augšupielāde noraidīta.</p>
    </div>

    <!-- Mapes saturs -->
    <div class="folder-view">
        <div class="folder-header">📁 Mana Mape (Augšupielādētie faili)</div>
        <div class="grid" id="file-grid">
            <!-- Šeit parādīsies faili -->
        </div>
    </div>
</div>

<script>
    const REQUIRED_PASSWORD = "!@#\(!@#\)";
    const fileInput = document.getElementById('file-input');
    const passwordInput = document.getElementById('password-input');
    const errorMessage = document.getElementById('error-message');
    const fileGrid = document.getElementById('file-grid');

    // Ielādēt jau saglabātos failus lapas ielādes brīdī
    document.addEventListener('DOMContentLoaded', loadFiles);

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Paroles pārbaude
        if (passwordInput.value !== REQUIRED_PASSWORD) {
            errorMessage.style.display = 'block';
            fileInput.value = ''; // Notīra ievadi
            return;
        }

        errorMessage.style.display = 'none';

        // Failu apstrāde un saglabāšana
        const reader = new FileReader();
        reader.onload = function(event) {
            const fileData = {
                name: file.name,
                type: file.type || 'unknown',
                extension: file.name.split('.').pop()
            };

            saveFileToStorage(fileData);
            renderFile(fileData);
            
            // Notīra ievades laukus pēc veiksmīgas darbības
            fileInput.value = '';
            passwordInput.value = '';
        };
        
        reader.readAsDataURL(file);
    });

    function saveFileToStorage(fileData) {
        let files = JSON.parse(localStorage.getItem('uploadedFiles')) || [];
        files.push(fileData);
        localStorage.setItem('uploadedFiles', JSON.stringify(files));
    }

    function loadFiles() {
        let files = JSON.parse(localStorage.getItem('uploadedFiles')) || [];
        files.forEach(renderFile);
    }

    function renderFile(fileData) {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';

        // Nosaka emocijzīmi (ikonu) pēc faila tipa paplašinājuma
        let icon = '📄';
        const ext = fileData.extension.toLowerCase();
        
        if (['jpg', 'jpeg', 'png', 'gif', 'svg'].includes(ext)) icon = '🖼️';
        else if (['pdf'].includes(ext)) icon = '📕';
        else if (['doc', 'docx', 'txt', 'rtf'].includes(ext)) icon = '📝';
        else if (['zip', 'rar', '7z', 'tar'].includes(ext)) icon = '📦';
        else if (['mp3', 'wav', 'ogg'].includes(ext)) icon = '🎵';
        else if (['mp4', 'mkv', 'avi'].includes(ext)) icon = '🎥';
        else if (['xls', 'xlsx', 'csv'].includes(ext)) icon = '📊';

        fileItem.innerHTML = `
            <div class="file-icon">${icon}</div>
            <div class="file-name" title="${fileData.name}">${fileData.name}</div>
            <div class="file-type">.${fileData.extension}</div>
        `;

        fileGrid.appendChild(fileItem);
    }
</script>

</body>
</html>
